<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盘前简报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  /* 布局：灰色侧边栏 + 白色正文。只有摘要卡、多空两栏和图表用卡片，其余内容用细线分隔 */
  :root {
    --bg: #ffffff; --side: #f4f6f9; --tint: #f6f8fb; --line: #e4e8ee; --line-strong: #cdd5df;
    --text: #17202a; --muted: #5a6572; --faint: #8b95a1;
    --accent: #1f5fd1; --accent-soft: #e9f0fd;
    --warn: #9a6100; --warn-soft: #fff3d6; --flat: #6e7781;
    /* 默认绿涨红跌：绿色是涨和利多，红色是跌和利空。侧边栏按钮切换到红涨绿跌 */
    --up: #16803c; --up-soft: #e4f5e9; --down: #cc2f2f; --down-soft: #fdeceb;
    --font-text: "Inter", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    --font-display: "Space Grotesk", "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-colors="cn"] { --up: #cc2f2f; --up-soft: #fdeceb; --down: #16803c; --down-soft: #e4f5e9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.75 var(--font-text); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
  .empty { color: var(--faint); font-size: 14px; padding: 12px 0; }

  /* 正文里的数字、日期和引用 */
  .rich p + p { margin-top: 10px; }
  .n { font-weight: 600; font-variant-numeric: tabular-nums; }
  .d { font-variant-numeric: tabular-nums; color: var(--muted); }
  .cite { color: var(--faint); font-size: 0.88em; }
  .cite .n, .cite .d { font-weight: inherit; color: inherit; }

  /* ---------- 骨架 ---------- */
  .layout { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side);
    border-right: 1px solid var(--line); padding: 24px 12px; display: flex; flex-direction: column; gap: 2px;
  }
  .brand { padding: 0 10px 18px; }
  .brand .title { font: 700 17px/1.3 var(--font-display); }
  .brand .meta { color: var(--faint); font-size: 12.5px; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-radius: 8px; color: var(--text); white-space: nowrap;
  }
  .nav-item:hover { background: var(--line); text-decoration: none; }
  .nav-item.active { background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
  .nav-item .label { font: 600 14.5px var(--font-display); letter-spacing: 0.01em; }
  .nav-item .side { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .nav-sep { height: 1px; background: var(--line); margin: 8px 10px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .nav-foot { margin-top: auto; padding: 16px 2px 0; }
  .toggle {
    width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg);
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .toggle:hover { border-color: var(--accent); }
  .swatch { display: inline-flex; gap: 3px; }
  .swatch i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

  main { padding: 36px 44px 96px; max-width: 1180px; width: 100%; min-width: 0; }
  .page-head { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .page-head h1 { margin: 0; font: 700 36px/1.15 var(--font-display); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; text-wrap: balance; }
  .page-head h1 .name { font: 400 16px var(--font-text); color: var(--muted); letter-spacing: 0; }

  .section { margin-top: 56px; }
  .section-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .section-head h2 { margin: 0; font: 700 28px/1.25 var(--font-display); text-wrap: balance; }
  .section-head .sub { color: var(--muted); font-size: 14px; }
  .block { margin-top: 36px; }
  .block-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .block-head h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .block-head small { color: var(--faint); font-size: 12.5px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--faint); }
  .sources { font-size: 12.5px; color: var(--faint); margin-top: 6px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 14px; font-size: 13px; color: var(--faint); }

  /* ---------- 标签 ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px;
    font-size: 12.5px; line-height: 20px; font-weight: 500; background: var(--tint); color: var(--muted); white-space: nowrap;
  }
  .pill.bull { background: var(--up-soft); color: var(--up); }
  .pill.bear { background: var(--down-soft); color: var(--down); }
  .pill.caution { background: var(--warn-soft); color: var(--warn); }
  .pill.official { background: var(--accent-soft); color: var(--accent); }
  .pill.rumor { background: var(--warn-soft); color: var(--warn); }
  .pill.lg { font-size: 15px; line-height: 24px; padding: 2px 14px; font-weight: 600; }
  .nav-item .pill { font-size: 11.5px; line-height: 18px; padding: 0 8px; }
  .tag {
    display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 12px; line-height: 20px;
    border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap;
  }
  .tag.level { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
  .tag.priced-none { background: var(--text); border-color: var(--text); color: var(--bg); }
  .tag.priced-part { border-color: var(--text); color: var(--text); }
  .tag.priced-full { background: var(--tint); border-color: var(--line); color: var(--faint); }
  .bull .tag.grade-high { background: var(--up); border-color: var(--up); color: var(--bg); }
  .bull .tag.grade-mid { background: var(--up-soft); border-color: var(--up); color: var(--up); }
  .bull .tag.grade-low { border-color: var(--up-soft); color: var(--up); }
  .bear .tag.grade-high { background: var(--down); border-color: var(--down); color: var(--bg); }
  .bear .tag.grade-mid { background: var(--down-soft); border-color: var(--down); color: var(--down); }
  .bear .tag.grade-low { border-color: var(--down-soft); color: var(--down); }
  .impact { display: inline-block; padding: 0 9px; border-radius: 4px; font-size: 12.5px; line-height: 22px; border: 1px solid transparent; white-space: nowrap; }
  .impact.pos { background: var(--up-soft); color: var(--up); border-color: var(--up); }
  .impact.neg { background: var(--down-soft); color: var(--down); border-color: var(--down); }
  .impact.neu { background: var(--tint); color: var(--muted); border-color: var(--line-strong); }
  .impact.market { font-weight: 700; }
  .impacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .importance { display: inline-block; padding: 0 9px; border-radius: 4px; font-size: 12.5px; line-height: 22px; white-space: nowrap; }
  .importance.high { background: var(--warn); color: var(--bg); }
  .importance.mid { background: var(--warn-soft); color: var(--warn); }
  .importance.low { background: var(--tint); color: var(--faint); }

  /* ---------- 摘要卡 ---------- */
  .brief { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .brief-top { padding: 22px 26px; background: var(--tint); display: grid; gap: 12px; }
  .brief-top .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brief-reason { font-size: 16px; }
  .brief-caution { display: flex; gap: 10px; align-items: baseline; color: var(--warn); font-size: 14px; }
  .brief-caution .pill { flex: none; }
  .brief-keys { padding: 20px 26px; border-top: 1px solid var(--line); }
  .keys { display: grid; gap: 10px; margin-top: 10px; counter-reset: key; }
  .keys li { display: grid; grid-template-columns: 26px minmax(0, 1fr); font-size: 15.5px; }
  .keys li::before { counter-increment: key; content: counter(key); font: 600 16px/1.75 var(--font-display); color: var(--accent); }
  .brief-scenarios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .scenario { padding: 20px 26px; min-width: 0; }
  .scenario + .scenario { border-left: 1px solid var(--line); }
  .scenario-title { font-weight: 600; margin-bottom: 10px; }
  .scenario.bull .scenario-title { color: var(--up); }
  .scenario.bear .scenario-title { color: var(--down); }
  .scenario ul { display: grid; gap: 14px; }
  .scenario .watch { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .scenario .watch .tag { flex: none; }

  /* ---------- 列表 ---------- */
  .rows > * { border-bottom: 1px solid var(--line); }
  .rows > *:first-child { border-top: 1px solid var(--line); }
  .move { display: grid; grid-template-columns: 132px 92px minmax(0, 1fr) auto; gap: 18px; align-items: baseline; padding: 14px 0; }
  .move .period { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .move .pct { font: 600 17px var(--font-display); font-variant-numeric: tabular-nums; }
  .pattern { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 18px; padding: 14px 0; }
  .pattern .name { font-weight: 600; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .pattern .basis { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .news { display: grid; grid-template-columns: 100px minmax(0, 1fr) auto; gap: 18px; padding: 14px 0; }
  .news .date { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .news .weekday { color: var(--faint); font-size: 12px; }
  .news .title { font-weight: 600; }
  .news .detail { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .news .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; align-self: start; font-size: 13px; }
  .feed-group + .feed-group { margin-top: 22px; }
  .feed-group .eyebrow { margin-bottom: 6px; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 36px; }
  .facts.single { grid-template-columns: minmax(0, 1fr); }
  .fact { padding: 14px 0; border-top: 1px solid var(--line); min-width: 0; }
  .fact-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .fact-text { font-size: 14.5px; }
  .callout { background: var(--accent-soft); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; }

  /* ---------- 财报拆解 ---------- */
  .sub-head { margin: 26px 0 10px; }
  .block-head + .sub-head { margin-top: 4px; }
  .scorecard-wrap { overflow-x: auto; }
  .scorecard { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .scorecard th { text-align: right; font-size: 12.5px; color: var(--faint); font-weight: 500; padding: 8px 14px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .scorecard td { text-align: right; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .scorecard th:first-child, .scorecard td:first-child { text-align: left; padding-left: 0; }
  .scorecard th:last-child, .scorecard td:last-child { padding-right: 0; }
  .scorecard td.metric { font-weight: 600; white-space: normal; min-width: 7em; }
  .scorecard td.actual { font: 600 16px var(--font-display); }
  .scorecard td.src { font-size: 12.5px; }
  .eitem { padding: 18px 0; }
  .eitem-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .eitem-name { font-size: 16px; font-weight: 600; }
  .eitem-summary { margin-top: 4px; font-size: 15px; }
  .views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .view { border-radius: 10px; padding: 12px 16px; font-size: 14px; min-width: 0; }
  .view.bull { background: color-mix(in srgb, var(--up-soft) 60%, var(--bg)); }
  .view.bear { background: color-mix(in srgb, var(--down-soft) 60%, var(--bg)); }
  .view-label { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .view.bull .view-label { color: var(--up); }
  .view.bear .view-label { color: var(--down); }

  /* ---------- 图表与指标 ---------- */
  .chart-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .chart { width: 100%; height: 520px; }
  .chart.compare { height: 300px; }
  .chart-missing { display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tile { background: var(--tint); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .tile .label { color: var(--muted); font-size: 12.5px; }
  .tile .value { font: 600 19px/1.4 var(--font-display); margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .verdict { font-size: 13px; }
  .tile .plain { color: var(--faint); font-size: 12px; line-height: 1.6; margin-top: 6px; }
  .index-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }

  /* ---------- 多空对照 ---------- */
  .case-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .case { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
  .case-head { padding: 14px 22px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .case.bull .case-head { background: var(--up-soft); }
  .case.bear .case-head { background: var(--down-soft); }
  .case-title { font: 700 21px var(--font-display); }
  .case.bull .case-title, .case.bull .rank { color: var(--up); }
  .case.bear .case-title, .case.bear .rank { color: var(--down); }
  .case-head .sub { color: var(--muted); font-size: 13.5px; }
  .case-body { padding: 4px 22px 22px; }
  .case-body .block { margin-top: 26px; }
  .top-item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 6px; padding: 10px 0; }
  .top-item .rank { font: 700 24px/1.2 var(--font-display); }
  .top-item .title { font-weight: 600; margin-right: 6px; }
  .top-item .detail { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .matrix { display: grid; grid-template-columns: 64px repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; line-height: 1.5; }
  .matrix > div { padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .matrix > div:nth-child(4n) { border-right: 0; }
  .matrix > div:nth-last-child(-n + 4) { border-bottom: 0; }
  .matrix .head { color: var(--muted); background: var(--tint); }
  .matrix .cell { min-height: 44px; }
  .bull .matrix .cell.weight-4 { background: var(--up-soft); }
  .bull .matrix .cell.weight-3 { background: color-mix(in srgb, var(--up-soft) 45%, var(--bg)); }
  .bear .matrix .cell.weight-4 { background: var(--down-soft); }
  .bear .matrix .cell.weight-3 { background: color-mix(in srgb, var(--down-soft) 45%, var(--bg)); }
  .chip { display: block; margin: 2px 0; }
  .chip b { color: var(--faint); margin-right: 4px; font-weight: 600; }
  .caption { font-size: 12.5px; color: var(--faint); margin-top: 8px; line-height: 1.6; }
  .point { padding: 14px 0; }
  .point .title { font-weight: 600; }
  .point .title b { color: var(--faint); margin-right: 6px; font-weight: 600; }
  .point .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .point .evidence { font-size: 14px; }
  .falsifier { padding: 12px 0; }
  .falsifier .signal { font-weight: 600; }
  .falsifier .check { font-size: 13.5px; color: var(--muted); margin-top: 2px; }

  @media (max-width: 1080px) {
    .case-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar {
      height: auto; flex-direction: row; align-items: center; overflow-x: auto; z-index: 10;
      border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; gap: 4px;
    }
    .brand, .nav-sep { display: none; }
    .nav-item, .nav-foot { flex: none; }
    .nav-foot { margin: 0 0 0 auto; padding: 0; }
    main { padding: 24px 16px 64px; }
    .chart { height: 440px; }
    .facts { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 720px) {
    .brief-top, .brief-keys, .scenario { padding-left: 18px; padding-right: 18px; }
    .brief-scenarios { grid-template-columns: minmax(0, 1fr); }
    .scenario + .scenario { border-left: 0; border-top: 1px solid var(--line); }
    .move { grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; }
    .move .text { grid-column: 1 / -1; }
    .pattern, .news { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .views { grid-template-columns: minmax(0, 1fr); }
    .news .meta { justify-content: flex-start; }
    .case-head, .case-body { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="layout" id="app"></div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('report-data').textContent);
  const REPORT = DATA.report;
  const MACRO = REPORT.macro || {};
  const STOCKS = REPORT.stocks || [];
  const SYMBOLS = (DATA.market && DATA.market.symbols) || {};
  const INDEX_SYMBOLS = ['^GSPC', '^IXIC'];
  const RECENT_DAYS = 14;
  const MISSING = '未找到';
  const MACRO_ROUTE = 'macro';
  const SCHEME_KEY = 'premarket-color-scheme';
  const SCHEME_LABEL = { us: '绿涨红跌', cn: '红涨绿跌' };
  const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const CHART_FONT = 'Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  const CATEGORY_ORDER = ['运营事件与日程', '合同与合作', '官方披露', '管理层言论', '分析师动作', '资金面', '监管与法律', '竞争对手与上下游'];
  const GRADES = ['高', '中', '低'];
  const PRICED = ['未计价', '部分', '已计价'];
  const PRICED_LABEL = { '未计价': '未计价', '部分': '部分计价', '已计价': '已计价' };
  const PRICED_CLASS = { '未计价': 'priced-none', '部分': 'priced-part', '已计价': 'priced-full' };
  const GRADE_CLASS = { '高': 'grade-high', '中': 'grade-mid', '低': 'grade-low' };
  const IMPORTANCE_CLASS = { '高': 'high', '中': 'mid', '低': 'low' };
  const DIRECTION_CLASS = { '利多': 'pos', '利空': 'neg', '中性': 'neu' };
  const SIDES = {
    bull: {
      title: 'Bull case', subtitle: '市场可能低估的利多', topTitle: '市场最看好的 Top 3', topEmpty: '没有找到市场明确看好的理由。',
      listTitle: '利多清单', gradeLabel: '力度', listEmpty: '认真查过之后，没有找到有实质内容的利多。',
      caption: '越靠左上越值得重视：力度大，而且市场还没有把它算进股价。已经充分计价的利多不再是买入理由。',
      falsifierNote: '出现这些信号，说明上面的利多不成立',
    },
    bear: {
      title: 'Bear case', subtitle: '市场可能不买账的原因', topTitle: '市场最担心的 Top 3', topEmpty: '没有找到市场明确在担心的问题。',
      listTitle: '利空清单', gradeLabel: '严重度', listEmpty: '认真查过之后，没有找到有实质内容的利空。',
      caption: '越靠左上越要警惕：后果严重，而且市场还没有把它算进股价。已经充分计价的利空并不可怕。',
      falsifierNote: '出现这些信号，说明上面的利空不成立',
    },
  };
  // 正文里要单独排版的片段，按顺序匹配：带日期的括号引用、带符号的涨跌幅、金额、日期、百分比和其他数字
  const TOKEN_PATTERNS = [
    ['cite', '[（(][^（）()]*?\\d{4}-\\d{2}-\\d{2}[^（）()]*?[）)]'],
    ['signed', '(?<![\\w.$])[+\\-−]\\d[\\d,]*(?:\\.\\d+)?%'],
    ['number', '\\$\\d[\\d,]*(?:\\.\\d+)?(?:[KMBT](?![A-Za-z]))?'],
    ['date', '\\d{4}-\\d{2}-\\d{2}'],
    ['number', '\\d[\\d,]*(?:\\.\\d+)?%'],
    ['number', '(?<![\\w.])\\d[\\d,]*\\.\\d+(?![\\w%])'],
    ['number', '(?<![\\w.,])\\d{1,3}(?:,\\d{3})+(?![\\w%.])'],
    ['date', '(?<![\\w.\\-])(?:0?[1-9]|1[0-2])-(?:0[1-9]|[12]\\d|3[01])(?![\\w%])'],
  ];
  const TOKEN_RE = new RegExp(TOKEN_PATTERNS.map(([, pattern]) => '(' + pattern + ')').join('|'), 'g');

  let colors = {};
  let charts = [];
  let pendingCharts = [];

  // ---------- 通用 ----------
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') node.className = value; else node.setAttribute(key, value);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false || child === '') continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function inline(text) {
    const source = String(text || '');
    const parts = [];
    let last = 0;
    for (const match of source.matchAll(TOKEN_RE)) {
      if (match.index > last) parts.push(source.slice(last, match.index));
      const kind = TOKEN_PATTERNS[match.slice(1).findIndex((group) => group !== undefined)][0];
      const token = match[0];
      const className = kind === 'cite' ? 'cite' : kind === 'date' ? 'd'
        : kind === 'signed' ? 'n ' + (/^[-−]/.test(token) ? 'down' : 'up') : 'n';
      parts.push(el('span', { class: className }, token));
      last = match.index + token.length;
    }
    if (last < source.length) parts.push(source.slice(last));
    return parts;
  }
  const PARAGRAPH_MIN_CHARS = 90;
  const TAIL_MERGE_CHARS = 30;
  // 按换行分段；没有换行的长文本按句号攒够约 90 字分一段，太短的末尾并进上一段
  function paragraphsOf(text) {
    const source = String(text || '').trim();
    if (!source) return [];
    if (source.includes('\n')) return source.split(/\n+/).map((paragraph) => paragraph.trim()).filter(Boolean);
    const paragraphs = [];
    let current = '';
    for (const sentence of source.match(/[^。！？]+[。！？]?/g) || [source]) {
      current += sentence;
      if (current.length >= PARAGRAPH_MIN_CHARS) { paragraphs.push(current); current = ''; }
    }
    if (current && paragraphs.length && current.length < TAIL_MERGE_CHARS) paragraphs[paragraphs.length - 1] += current;
    else if (current) paragraphs.push(current);
    return paragraphs;
  }
  function rich(text, className) {
    const paragraphs = paragraphsOf(text);
    if (!paragraphs.length) return null;
    return el('div', { class: 'rich' + (className ? ' ' + className : '') }, paragraphs.map((paragraph) => el('p', null, inline(paragraph))));
  }
  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function isNumber(value) { return typeof value === 'number' && isFinite(value); }
  function price(value) { return isNumber(value) ? value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : MISSING; }
  function signClass(value) { return !isNumber(value) || value === 0 ? 'flat' : value > 0 ? 'up' : 'down'; }
  function pct(value) { return isNumber(value) ? (value > 0 ? '+' : '') + value.toFixed(2) + '%' : MISSING; }
  function pctNode(value) { return el('span', { class: 'num ' + signClass(value) }, pct(value)); }
  function isHttpUrl(url) { return typeof url === 'string' && /^https?:\/\//i.test(url); }
  function sourceLink(url, name) {
    if (!isHttpUrl(url)) return name ? el('span', { class: 'faint' }, name) : null;
    return el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, name || '来源');
  }
  function sourceLine(sources) {
    const links = (sources || []).map((source) => sourceLink(source.url, source.name || source.url)).filter(Boolean);
    if (!links.length) return null;
    const parts = [];
    links.forEach((link, index) => { if (index) parts.push(' · '); parts.push(link); });
    return el('div', { class: 'sources' }, '来源：', parts);
  }
  function credibilityPill(value) {
    const kind = value === '官方确认' ? 'official' : value === '传闻' ? 'rumor' : '';
    return el('span', { class: 'pill ' + kind }, value || MISSING);
  }
  function tendencyPill(value, large) {
    const kind = value === '偏多' ? 'bull' : value === '偏空' ? 'bear' : '';
    return el('span', { class: 'pill ' + kind + (large ? ' lg' : '') }, value || '无倾向');
  }
  function cautionPill() { return el('span', { class: 'pill caution' }, '今日不宜动手'); }
  function pricedTag(value) { return el('span', { class: 'tag ' + (PRICED_CLASS[value] || '') }, PRICED_LABEL[value] || value || MISSING); }
  function importanceChip(value) {
    return value ? el('span', { class: 'importance ' + (IMPORTANCE_CLASS[value] || 'low') }, '重要性 ' + value) : null;
  }
  function empty(text) { return el('p', { class: 'empty' }, text); }
  function byNewestFirst(a, b) { return String(b.date).localeCompare(String(a.date)); }
  // 日期未定的事件排在最后
  function byEventDate(a, b) { return (a.date ? 0 : 1) - (b.date ? 0 : 1) || String(a.date).localeCompare(String(b.date)); }
  function weekday(date) {
    const day = new Date(date + 'T12:00:00Z');
    return isNaN(day) ? '' : WEEKDAYS[day.getUTCDay()];
  }
  function section(title, subtitle, ...children) {
    return el('section', { class: 'section' },
      el('div', { class: 'section-head' }, el('h2', null, title), subtitle && el('span', { class: 'sub' }, subtitle)),
      children);
  }
  function block(title, subtitle, ...children) {
    return el('div', { class: 'block' },
      el('div', { class: 'block-head' }, el('h3', null, title), subtitle && el('small', null, subtitle)),
      children);
  }
  function facts(items, single) {
    if (!(items || []).length) return null;
    return el('div', { class: 'facts' + (single ? ' single' : '') }, items.map((item) => el('div', { class: 'fact' },
      el('div', { class: 'fact-label' }, item.item || ''),
      rich(item.conclusion, 'fact-text') || el('div', { class: 'fact-text' }, MISSING),
      sourceLine(item.sources))));
  }

  // ---------- 配色 ----------
  function loadScheme() {
    try { return localStorage.getItem(SCHEME_KEY) === 'cn' ? 'cn' : 'us'; } catch (error) { return 'us'; }
  }
  function saveScheme(scheme) {
    // 存储不可用时（隐私模式等），切换只在本次打开期间有效
    try { localStorage.setItem(SCHEME_KEY, scheme); } catch (error) { /* 见上 */ }
  }
  function applyScheme(scheme) {
    if (scheme === 'cn') document.documentElement.setAttribute('data-colors', 'cn');
    else document.documentElement.removeAttribute('data-colors');
    const css = getComputedStyle(document.documentElement);
    const read = (name) => css.getPropertyValue(name).trim();
    colors = {
      up: read('--up'), down: read('--down'), text: read('--text'), muted: read('--muted'), faint: read('--faint'),
      line: read('--line'), accent: read('--accent'), warn: read('--warn'), bg: read('--bg'),
    };
  }
  function currentScheme() { return document.documentElement.getAttribute('data-colors') === 'cn' ? 'cn' : 'us'; }

  // ---------- 图表 ----------
  const CHART_LIB_MISSING = '图表库加载失败（需要联网）';
  function chartMissing(node, text) { node.classList.add('chart-missing'); node.textContent = text; }
  function initChart(node) {
    const chart = echarts.init(node, null, { renderer: 'canvas' });
    charts.push(chart);
    return chart;
  }
  function tooltipStyle() {
    return {
      backgroundColor: colors.bg, borderColor: colors.line, textStyle: { color: colors.text, fontFamily: CHART_FONT },
      extraCssText: 'box-shadow: 0 6px 20px rgba(23,32,42,.12); border-radius: 8px;',
    };
  }

  function newsByTradingDay(news, dates) {
    // 非交易日的新闻归到之后第一个交易日，那才是股价能反应的时点
    const grouped = {};
    for (const item of news || []) {
      if (!item.date) continue;
      const day = dates.find((date) => date >= item.date);
      if (!day) continue;
      (grouped[day] = grouped[day] || []).push(item);
    }
    return grouped;
  }

  function renderCandleChart(node, stock, market) {
    if (typeof echarts === 'undefined') return chartMissing(node, CHART_LIB_MISSING);
    const candles = market.candles || [];
    if (!candles.length) return chartMissing(node, 'K 线数据' + MISSING);
    const dates = candles.map((candle) => candle.date);
    const grouped = newsByTradingDay(stock.news, dates);
    const newsPoints = Object.keys(grouped).map((date) => {
      const candle = candles[dates.indexOf(date)];
      return { coord: [date, candle.high], value: grouped[date].length, news: grouped[date] };
    });
    const levels = [];
    for (const level of market.indicators.support || []) levels.push({ yAxis: level.price, name: '支撑 ' + price(level.price), lineStyle: { color: colors.up } });
    for (const level of market.indicators.resistance || []) levels.push({ yAxis: level.price, name: '压力 ' + price(level.price), lineStyle: { color: colors.down } });
    const recentStart = dates[Math.max(0, dates.length - RECENT_DAYS)], recentEnd = dates[dates.length - 1];
    // 标签放在线的外侧：最高价线之上、最低价线之下没有这 14 天的 K 线，不会互相遮挡
    const recentExtreme = (extreme, name, color, position) => extreme && levels.push([
      { coord: [recentStart, extreme.price], name: name + ' ' + price(extreme.price), lineStyle: { color, type: 'dotted', width: 1.5 }, label: { position } },
      { coord: [recentEnd, extreme.price] },
    ]);
    recentExtreme(market.indicators.recent_high, '近14日最高', colors.down, 'insideStartTop');
    recentExtreme(market.indicators.recent_low, '近14日最低', colors.up, 'insideStartBottom');
    const maLine = (name, key, color) => ({
      name, type: 'line', data: candles.map((candle) => candle[key]), showSymbol: false, smooth: false,
      lineStyle: { width: 1.2, color }, itemStyle: { color }, connectNulls: false,
    });
    const startIndex = Math.max(0, candles.length - 60);
    initChart(node).setOption({
      backgroundColor: 'transparent', animation: false,
      textStyle: { color: colors.text, fontFamily: CHART_FONT },
      legend: { top: 0, textStyle: { color: colors.muted }, data: ['K 线', 'MA20', 'MA50', 'MA200'] },
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      tooltip: Object.assign(tooltipStyle(), {
        trigger: 'axis', axisPointer: { type: 'cross' }, confine: true,
        formatter: function (params) {
          const candle = candles[params[0].dataIndex];
          const lines = ['<b>' + candle.date + '</b>',
            '开 ' + price(candle.open) + '　高 ' + price(candle.high) + '　低 ' + price(candle.low) + '　收 ' + price(candle.close),
            '涨跌 ' + pct(candle.change_pct) + '　成交量 ' + (candle.volume / 1e6).toFixed(1) + 'M'];
          for (const item of grouped[candle.date] || []) {
            lines.push('<span style="color:' + colors.warn + '">●</span> ' + escapeHtml(item.title || '') + ' <span style="color:' + colors.faint + '">[' + escapeHtml(item.credibility || '') + ']</span>');
          }
          return '<div style="max-width:420px;white-space:normal;line-height:1.6">' + lines.join('<br>') + '</div>';
        },
      }),
      grid: [{ left: 56, right: 84, top: 36, height: 320 }, { left: 56, right: 84, top: 386, height: 70 }],
      xAxis: [
        { type: 'category', data: dates, gridIndex: 0, axisLine: { lineStyle: { color: colors.line } }, axisTick: { show: false }, axisLabel: { show: false } },
        { type: 'category', data: dates, gridIndex: 1, axisLine: { lineStyle: { color: colors.line } }, axisTick: { show: false }, axisLabel: { color: colors.faint } },
      ],
      yAxis: [
        { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: colors.line } }, axisLabel: { color: colors.faint } },
        { scale: true, gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } },
      ],
      dataZoom: [
        { type: 'inside', xAxisIndex: [0, 1], startValue: startIndex, endValue: candles.length - 1 },
        { type: 'slider', xAxisIndex: [0, 1], startValue: startIndex, endValue: candles.length - 1, bottom: 8, height: 22, textStyle: { color: colors.faint }, borderColor: colors.line },
      ],
      series: [
        {
          name: 'K 线', type: 'candlestick', data: candles.map((candle) => [candle.open, candle.close, candle.low, candle.high]),
          itemStyle: { color: colors.up, color0: colors.down, borderColor: colors.up, borderColor0: colors.down },
          markLine: { symbol: 'none', silent: true, data: levels, lineStyle: { type: 'dashed', width: 1 }, label: { formatter: '{b}', color: colors.muted, position: 'end' } },
          markPoint: { symbol: 'pin', symbolSize: 34, data: newsPoints, itemStyle: { color: colors.warn }, label: { color: colors.bg, fontSize: 11 } },
          markArea: {
            silent: true, itemStyle: { color: colors.accent, opacity: 0.06 }, label: { show: false },
            data: [[{ xAxis: recentStart }, { xAxis: recentEnd }]],
          },
        },
        maLine('MA20', 'sma20', '#bf8700'), maLine('MA50', 'sma50', '#1f5fd1'), maLine('MA200', 'sma200', '#8250df'),
        {
          name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
          data: candles.map((candle) => ({ value: candle.volume, itemStyle: { color: candle.close >= candle.open ? colors.up : colors.down, opacity: 0.6 } })),
        },
      ],
    });
  }

  // entries 是 [{ symbol, name }]，以第一个可用代码的最近 14 个交易日为基准算累计涨跌
  function renderCompareChart(node, entries) {
    if (typeof echarts === 'undefined') return chartMissing(node, CHART_LIB_MISSING);
    const available = entries.filter((entry) => SYMBOLS[entry.symbol] && !SYMBOLS[entry.symbol].error && (SYMBOLS[entry.symbol].candles || []).length);
    const base = available.length ? SYMBOLS[available[0].symbol].candles.slice(-(RECENT_DAYS + 1)) : [];
    if (base.length < 2) return chartMissing(node, '对比数据' + MISSING);
    const dates = base.map((candle) => candle.date);
    const palette = [colors.text, '#1f5fd1', '#8250df', '#bf8700'];
    const series = available.map((entry, index) => {
      const closes = {};
      for (const candle of SYMBOLS[entry.symbol].candles) closes[candle.date] = candle.close;
      const start = closes[dates[0]];
      const color = palette[index % palette.length];
      return {
        name: entry.name, type: 'line', showSymbol: false, connectNulls: true,
        lineStyle: { width: index === 0 ? 2.6 : 1.4, color }, itemStyle: { color },
        data: dates.map((date) => (start && closes[date] ? +((closes[date] / start - 1) * 100).toFixed(2) : null)),
      };
    });
    initChart(node).setOption({
      backgroundColor: 'transparent', animation: false,
      textStyle: { fontFamily: CHART_FONT },
      legend: { top: 0, textStyle: { color: colors.muted } },
      tooltip: Object.assign(tooltipStyle(), { trigger: 'axis', valueFormatter: (value) => pct(value) }),
      grid: { left: 56, right: 30, top: 36, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLine: { lineStyle: { color: colors.line } }, axisTick: { show: false }, axisLabel: { color: colors.faint } },
      yAxis: { type: 'value', axisLabel: { color: colors.faint, formatter: '{value}%' }, splitLine: { lineStyle: { color: colors.line } } },
      series,
    });
  }
  function indexEntries() {
    return INDEX_SYMBOLS.map((symbol) => ({ symbol, name: (SYMBOLS[symbol] && SYMBOLS[symbol].name) || symbol }));
  }
  function chartBox(node) { return el('div', { class: 'chart-box' }, node); }

  // ---------- 侧边栏 ----------
  function navItem(route, label, side) {
    return el('a', { class: 'nav-item', href: '#' + encodeURIComponent(route), 'data-route': route },
      el('span', { class: 'label' }, label), el('span', { class: 'side' }, side));
  }
  function schemeSwatch(scheme) {
    const [rise, fall] = scheme === 'cn' ? ['#cc2f2f', '#16803c'] : ['#16803c', '#cc2f2f'];
    return el('span', { class: 'swatch' }, el('i', { style: 'background:' + rise }), el('i', { style: 'background:' + fall }));
  }
  function renderSidebar() {
    const toggle = el('button', { class: 'toggle', type: 'button', title: '切换红绿配色' },
      el('span', null, '配色：', SCHEME_LABEL[currentScheme()]), schemeSwatch(currentScheme()));
    toggle.addEventListener('click', () => {
      const next = currentScheme() === 'cn' ? 'us' : 'cn';
      saveScheme(next);
      applyScheme(next);
      render(true);
    });
    return el('nav', { class: 'sidebar' },
      el('div', { class: 'brand' }, el('div', { class: 'title' }, '盘前简报'), el('div', { class: 'meta' }, REPORT.date || '')),
      navItem(MACRO_ROUTE, '宏观', null),
      el('div', { class: 'nav-sep' }),
      STOCKS.map((stock) => navItem(stock.ticker, stock.ticker, [
        stock.caution && stock.caution.flag && el('span', { class: 'dot', title: '今日不宜动手' }),
        tendencyPill(stock.tendency),
      ])),
      el('div', { class: 'nav-foot' }, toggle));
  }

  // ---------- 消息和事件的行 ----------
  function impactChip(name, direction, extraClass) {
    return el('span', { class: 'impact ' + (DIRECTION_CLASS[direction] || 'neu') + (extraClass ? ' ' + extraClass : ''), title: direction || '' }, name);
  }
  function impactChips(item) {
    const industries = item.industries || [];
    if (!item.market_impact && !industries.length) return null;
    return el('div', { class: 'impacts' },
      item.market_impact && impactChip('大盘', item.market_impact, 'market'),
      industries.map((industry) => impactChip(industry.name || '', industry.impact)));
  }
  function dateCell(date, withWeekday) {
    return el('div', { class: 'date' }, date || '日期未定', withWeekday && date && el('div', { class: 'weekday' }, weekday(date)));
  }
  function newsRow(item, meta) {
    return el('div', { class: 'news' },
      dateCell(item.date, false),
      el('div', null,
        el('div', { class: 'title' }, inline(item.title)),

      el('div', { class: 'meta' }, meta, sourceLink(item.source_url, item.source_name)));

  function eventRow(event, showScope) {

      dateCell(event.date, true),
      el('div', null,
        el('div', { class: 'title' }, inline(event.event)),

      el('div', { class: 'meta' },

        sourceLink(event.source_url, event.source_name)));
  }
  function impactLegend(extra) {
    return el('div', { class: 'legend' }, '色块：', impactChip('利多', '利多'), impactChip('利空', '利空'), impactChip('中性', '中性'), extra);
  }

  // ---------- 宏观页 ----------
  function renderMacroPage() {
    const indexTiles = INDEX_SYMBOLS.filter((symbol) => SYMBOLS[symbol] && !SYMBOLS[symbol].error).map((symbol) => {
      const data = SYMBOLS[symbol];
      return el('div', { class: 'tile' },
        el('div', { class: 'label' }, data.name + ' · ' + data.last_date),
        el('div', { class: 'value' }, price(data.last_close), ' ', pctNode(data.last_change_pct)),
        el('div', { class: 'verdict' }, '近 14 个交易日 ', pctNode(data.indicators.change_14d_pct)));
    });
    const chartNode = el('div', { class: 'chart compare' });
    pendingCharts.push(() => renderCompareChart(chartNode, indexEntries()));

    const news = (MACRO.news || []).slice().sort(byNewestFirst).map((item) => newsRow(item, null));
    const events = (MACRO.calendar || []).slice().sort(byEventDate).map((event) => eventRow(Object.assign({ scope: '宏观' }, event), false));
    return [
      el('header', { class: 'page-head' }, el('h1', null, '宏观')),
      section('大盘近况', '近 14 个交易日',
        el('div', { class: 'index-tiles' }, indexTiles),
        rich(MACRO.summary),
        el('div', { style: 'margin-top:16px' }, chartBox(chartNode))),
      section('宏观消息', '过去 14 天',
        impactLegend('第一个是对大盘的影响，后面是受影响最大的行业'),
        news.length ? el('div', { class: 'rows' }, news) : empty(MISSING)),
      section('宏观日历', '未来 14 天',
        impactLegend('方向还不确定时为中性'),
        events.length ? el('div', { class: 'rows' }, events) : empty(MISSING)),
    ];
  }

  // ---------- 个股页：今日分析 ----------
  function renderBrief(stock) {
    const caution = stock.caution || {};
    const scenarios = stock.scenarios || {};
    const scenario = (title, kind, items) => el('div', { class: 'scenario ' + kind },
      el('div', { class: 'scenario-title' }, title),
      (items || []).length ? el('ul', null, items.map((item) => el('li', null,
        el('div', null, inline(item.condition)),
        el('div', { class: 'watch' }, el('span', { class: 'tag' }, '盯'), el('span', null, inline(item.signal || MISSING))))))
        : empty(MISSING));
    return el('div', { class: 'brief' },
      el('div', { class: 'brief-top' },
        el('div', { class: 'row' }, el('span', { class: 'eyebrow' }, '方向倾向'), tendencyPill(stock.tendency, true)),
        rich(stock.tendency_reason, 'brief-reason'),
        caution.flag && el('div', { class: 'brief-caution' }, cautionPill(), el('span', null, inline(caution.reason)))),
      (stock.key_points || []).length ? el('div', { class: 'brief-keys' },
        el('div', { class: 'eyebrow' }, '今天最重要的事'),
        el('ol', { class: 'keys' }, stock.key_points.map((point) => el('li', null, el('span', null, inline(point)))))) : null,
      el('div', { class: 'brief-scenarios' },
        scenario('▲ 偏利好的情况', 'bull', scenarios.bullish),
        scenario('▼ 偏利空的情况', 'bear', scenarios.bearish)));
  }

  function renderPriceAction(stock) {
    const moves = (stock.price_action || []).map((item) => el('div', { class: 'move' },
      el('div', { class: 'period' }, item.period || ''),
      el('div', { class: 'pct ' + signClass(item.move_pct) }, pct(item.move_pct)),
      el('div', { class: 'text' }, rich(item.explanation)),
      el('div', null, item.driver && el('span', { class: 'pill' }, item.driver + '驱动'))));
    return block('走势与消息对照', '近 14 个交易日', moves.length ? el('div', { class: 'rows' }, moves) : empty(MISSING));
  }

  // 指标的解释文字固定在模板里，保证每次措辞一致
  function tile(label, valueNode, verdict, plain) {
    return el('div', { class: 'tile' }, el('div', { class: 'label' }, label), el('div', { class: 'value' }, valueNode),
      verdict && el('div', { class: 'verdict' }, verdict), el('div', { class: 'plain' }, plain));
  }
  function maVerdict(close, average, label) {
    if (!isNumber(average)) return el('span', { class: 'faint' }, label + ' 数据不足');
    const above = close >= average;
    return el('span', { class: above ? 'up' : 'down' }, (above ? '高于 ' : '低于 ') + label + '（' + price(average) + '）');
  }
  function levelText(levels) {
    if (!levels || !levels.length) return '未识别到';
    return levels.map((level) => price(level.price) + '（' + level.touches + ' 次）').join('、');
  }
  function extremeText(label, extreme) {
    return extreme ? label + ' ' + price(extreme.price) + '（' + extreme.date.slice(5) + '）' : null;
  }
  function renderIndicatorTiles(market) {
    const ind = market.indicators, close = market.last_close;
    const rsi = ind.rsi14;
    const rsiVerdict = !isNumber(rsi) ? MISSING : rsi >= 70 ? '超买区：短期涨得急，容易回调' : rsi <= 30 ? '超卖区：短期跌得急，容易反弹' : '中性区间';
    const volume = ind.volume_ratio;
    const volumeVerdict = !isNumber(volume) ? MISSING : volume >= 1.5 ? '明显放量：这一天的涨跌有资金认可' : volume <= 0.7 ? '缩量：参与的人少，涨跌的说服力弱' : '成交量正常';
    const gaps = ind.gaps || [];
    const gapText = gaps.length ? gaps.map((gap) => gap.date.slice(5) + (gap.direction === 'up' ? ' 向上' : ' 向下') + (gap.filled ? '（已回补）' : '（未回补）')).join('、') : '近 14 个交易日无缺口';
    return el('div', { class: 'tiles' },
      tile('近 14 个交易日涨跌', pctNode(ind.change_14d_pct), null, '从 14 个交易日前的收盘价到最新收盘价的累计变化。'),
      tile('短期趋势 · 20 日均线', price(ind.sma20), maVerdict(close, ind.sma20, 'MA20'), '最近 20 天的平均成本。股价在它上方说明短期买的人多数赚钱，趋势偏强。'),
      tile('中期趋势 · 50 日均线', price(ind.sma50), maVerdict(close, ind.sma50, 'MA50'), '最近 50 天的平均成本，机构常用来判断中期趋势。'),
      tile('长期趋势 · 200 日均线', price(ind.sma200), maVerdict(close, ind.sma200, 'MA200'), '近一年的平均成本，常被当作牛熊分界线。上市不满 200 天则没有这个值。'),
      tile('RSI（14 日）', isNumber(rsi) ? rsi.toFixed(1) : MISSING, rsiVerdict, '衡量最近涨得急不急的指标，0 到 100。高于 70 算过热，低于 30 算过冷。'),
      tile('成交量 / 20 日均量', isNumber(volume) ? volume.toFixed(2) + ' 倍' : MISSING, volumeVerdict, '最新一天的成交量是平时的几倍。放量的涨跌比缩量的更可信。'),
      tile('支撑位', el('span', { style: 'font-size:15px' }, levelText(ind.support)), extremeText('近 14 日最低', ind.recent_low), '过去多次跌到这里就被买回去的价位，跌破它通常会加速下跌。近 14 日最低价只出现过一次，仅作参考。'),
      tile('压力位', el('span', { style: 'font-size:15px' }, levelText(ind.resistance)), extremeText('近 14 日最高', ind.recent_high), '过去多次涨到这里就被卖下来的价位，放量突破它通常是强势信号。近 14 日最高价只出现过一次，仅作参考。'),
      tile('距 52 周高点', pctNode(ind.pct_from_week52_high), '52 周区间 ' + price(ind.week52_low) + ' – ' + price(ind.week52_high), '当前价格离过去一年最高价有多远。'),
      tile('跳空缺口', el('span', { style: 'font-size:15px' }, gapText), null, '开盘价直接跳过前一天的价格区间，中间没有成交。未回补的缺口常被当作之后的支撑或压力。'));
  }

  function renderTechnical(stock, market) {
    const technical = stock.technical || {};
    const summary = rich(technical.summary);
    if (market.error || !market.candles) {
      return block('技术分析', '描述现状和关键价位，不是预测依据', summary,
        empty('行情数据获取失败，图表和技术指标不可用。' + (stock.price_data_note || '')));
    }
    const candleNode = el('div', { class: 'chart' });
    const compareNode = el('div', { class: 'chart compare' });
    const compareEntries = [{ symbol: stock.ticker, name: stock.ticker }]
      .concat(stock.sector_etf ? [{ symbol: stock.sector_etf, name: stock.sector_etf + '（板块）' }] : [])
      .concat(indexEntries());
    // ECharts 要在容器进入页面、有尺寸之后才能初始化
    pendingCharts.push(() => { renderCandleChart(candleNode, stock, market); renderCompareChart(compareNode, compareEntries); });
    const patterns = (technical.patterns || []).map((pattern) => el('div', { class: 'pattern' },
      el('div', { class: 'name' }, pattern.name || '', el('span', { class: 'pill ' + (pattern.status === '明确' ? 'official' : 'rumor') }, pattern.status || '疑似')),
      el('div', null, el('div', null, inline(pattern.plain)), el('div', { class: 'basis' }, '依据：', inline(pattern.basis || MISSING)))));
    return [
      block('技术分析', '描述现状和关键价位，不是预测依据', summary),
      block('K 线', '图钉是新闻，悬停查看；虚线是支撑位和压力位；阴影是近 14 个交易日，点线是这期间的最高价和最低价；拖动下方滑块看 6 个月', chartBox(candleNode)),
      block('相对表现', '近 14 个交易日累计涨跌，对比板块和大盘', chartBox(compareNode)),
      block('指标', null, renderIndicatorTiles(market)),
      block('形态', '形态判断带主观成分', patterns.length ? el('div', { class: 'rows' }, patterns) : empty('无明显形态。')),
    ];
  }

  // ---------- 个股页：多空对照 ----------
  function rankPoints(points) {
    const weight = (point) => (2 - GRADES.indexOf(point.impact)) + (2 - PRICED.indexOf(point.priced_in));
    return (points || []).map((point, index) => ({ point, index }))
      .sort((a, b) => weight(b.point) - weight(a.point) || GRADES.indexOf(a.point.impact) - GRADES.indexOf(b.point.impact) || a.index - b.index)
      .map((entry, position) => Object.assign({ number: position + 1 }, entry.point));
  }
  function renderMatrix(points, meta) {
    const matrix = el('div', { class: 'matrix' }, el('div', { class: 'head' }, meta.gradeLabel), PRICED.map((priced) => el('div', { class: 'head' }, PRICED_LABEL[priced])));
    GRADES.forEach((grade, row) => {
      matrix.append(el('div', { class: 'head' }, grade));
      PRICED.forEach((priced, column) => {
        const here = points.filter((point) => point.impact === grade && point.priced_in === priced);
        matrix.append(el('div', { class: 'cell weight-' + ((2 - row) + (2 - column)) },
          here.map((point) => el('span', { class: 'chip' }, el('b', null, '#' + point.number), point.title || ''))));
      });
    });
    return matrix;
  }
  function renderCase(stock, side) {
    const meta = SIDES[side];
    const data = stock[side] || {};
    const top = data.top || [];
    const points = rankPoints(data.points);
    const falsifiers = data.falsifiers || [];
    return el('div', { class: 'case ' + side },
      el('div', { class: 'case-head' }, el('span', { class: 'case-title' }, meta.title), el('span', { class: 'sub' }, meta.subtitle)),
      el('div', { class: 'case-body' },
        block(meta.topTitle, null, top.length ? el('div', { class: 'rows' }, top.map((item, index) => el('div', { class: 'top-item' },
          el('div', { class: 'rank' }, index + 1),
          el('div', null,
            el('div', null, el('span', { class: 'title' }, item.title || ''), el('span', { class: 'tag level' }, item.level || MISSING)),
            rich(item.detail, 'detail')))))
          : empty(meta.topEmpty)),
        block(meta.listTitle, null,
          points.length ? [
            renderMatrix(points, meta),
            el('div', { class: 'caption' }, meta.caption),
            el('div', { class: 'rows', style: 'margin-top:12px' }, points.map((point) => el('div', { class: 'point' },
              el('div', { class: 'title' }, el('b', null, '#' + point.number), point.title || ''),
              el('div', { class: 'tags' },
                el('span', { class: 'tag level' }, point.level || MISSING),
                el('span', { class: 'tag ' + (GRADE_CLASS[point.impact] || '') }, meta.gradeLabel + ' ' + (point.impact || MISSING)),
                pricedTag(point.priced_in)),
              rich(point.evidence || MISSING, 'evidence'),
              sourceLine(point.sources)))),
          ] : empty(meta.listEmpty)),
        block('证伪条件', meta.falsifierNote, falsifiers.length ? el('div', { class: 'rows' }, falsifiers.map((entry) => el('div', { class: 'falsifier' },
          el('div', { class: 'signal' }, inline(entry.signal)),
          entry.check && el('div', { class: 'check' }, '怎么检验：', inline(entry.check)))))
          : empty(MISSING)),
        side === 'bear' && block('通用空头清单', '只列有实质内容的项',
          facts(data.general_risks, true) || empty('竞争、客户集中度、监管诉讼、资产负债表、内部人、会计这几项都查过，没有发现有实质内容的利空。'))));
  }

  // ---------- 个股页：财报拆解 ----------
  const TRADING_DAYS_1M = 21;
  const TRADING_DAYS_3M = 63;
  // 财报后第一个能反应的交易日：盘后发布看下一个交易日，盘前发布看当天。还没有这一天的行情时 pending 为 true
  function earningsMoves(candles, reportDate, timing) {
    if (!candles || !candles.length || !reportDate) return null;
    const dates = candles.map((candle) => candle.date);
    const reaction = dates.findIndex((date) => (timing === '盘前' ? date >= reportDate : date > reportDate));
    const pending = reaction === -1;
    const before = pending ? dates.length - 1 : reaction - 1;
    if (before < 0) return null;
    const change = (from, to) => (from >= 0 && to > from ? +((candles[to].close / candles[from].close - 1) * 100).toFixed(2) : null);
    return {
      pending,
      reactionDate: pending ? null : dates[reaction],
      month1: change(before - TRADING_DAYS_1M, before),
      month3: change(before - TRADING_DAYS_3M, before),
      reaction: pending ? null : change(before, reaction),
      since: pending ? null : change(reaction, dates.length - 1),
    };
  }
  function moveTile(label, value, sectorLabel, sectorValue, note) {
    return el('div', { class: 'tile' }, el('div', { class: 'label' }, label),
      el('div', { class: 'value' }, isNumber(value) ? pctNode(value) : el('span', { class: 'faint', style: 'font-size:15px' }, note || '—')),
      isNumber(sectorValue) && el('div', { class: 'verdict faint' }, sectorLabel + ' ', pctNode(sectorValue)));
  }
  function impliedTile(impliedMove, reaction) {
    const implied = parseFloat(String(impliedMove || '').replace(/[^\d.]/g, ''));
    const compare = isNumber(implied) && isNumber(reaction)
      ? '实际 ' + Math.abs(reaction).toFixed(1) + '%，' + (Math.abs(reaction) > implied ? '大于' : '小于') + '隐含波动' : null;
    return el('div', { class: 'tile' }, el('div', { class: 'label' }, '期权隐含波动'),
      el('div', { class: 'value' }, impliedMove || MISSING), compare && el('div', { class: 'verdict faint' }, compare));
  }
  function signedCell(text) {
    const value = String(text || '').trim();
    const kind = /^\+/.test(value) ? ' up' : /^[-−]/.test(value) ? ' down' : '';
    return el('td', { class: 'n' + kind }, value || '—');
  }
  function renderScorecard(rows) {
    const hasWhisper = rows.some((row) => row.whisper);
    const hasPrior = rows.some((row) => row.prior_surprise);
    const headers = ['指标', '实际', '一致预期'].concat(hasWhisper ? ['买方预期'] : [], ['差异'], hasPrior ? ['上季差异'] : [], ['来源']);
    return el('div', { class: 'scorecard-wrap' }, el('table', { class: 'scorecard' },
      el('thead', null, el('tr', null, headers.map((header) => el('th', null, header)))),
      el('tbody', null, rows.map((row) => el('tr', null,
        el('td', { class: 'metric' }, row.metric || ''),
        el('td', { class: 'actual' }, row.actual || MISSING),
        el('td', null, row.consensus || MISSING),
        hasWhisper && el('td', null, row.whisper || '—'),
        signedCell(row.surprise),
        hasPrior && signedCell(row.prior_surprise),
        el('td', { class: 'src' }, sourceLink(row.source_url, row.source_name)))))));
  }
  function leanPill(value) {
    const kind = value === '偏多' ? 'bull' : value === '偏空' ? 'bear' : '';
    return el('span', { class: 'pill ' + kind }, value || '中性');
  }
  function renderEarningsItem(item) {
    return el('div', { class: 'eitem' },
      el('div', { class: 'eitem-head' }, el('span', { class: 'eitem-name' }, item.item || ''), leanPill(item.lean)),
      item.summary && el('div', { class: 'eitem-summary' }, inline(item.summary)),
      el('div', { class: 'views' },
        el('div', { class: 'view bull' }, el('div', { class: 'view-label' }, '多头怎么看'), rich(item.bull) || MISSING),
        el('div', { class: 'view bear' }, el('div', { class: 'view-label' }, '空头怎么看'), rich(item.bear) || MISSING)),
      sourceLine(item.sources));
  }
  function renderEarnings(stock, market) {
    const earnings = stock.earnings || {};
    const moves = market.error ? null : earningsMoves(market.candles, earnings.report_date, earnings.report_timing);
    const sectorData = SYMBOLS[stock.sector_etf];
    const sectorMoves = sectorData && !sectorData.error ? earningsMoves(sectorData.candles, earnings.report_date, earnings.report_timing) : null;
    const sectorLabel = '板块 ' + (stock.sector_etf || '');
    const sector = (key) => (sectorMoves ? sectorMoves[key] : null);
    const missing = market.error || !market.candles ? '行情不可用' : !moves ? '超出行情范围' : null;
    const afterNote = moves && moves.pending ? '尚未开盘' : missing;
    const reactionLabel = (earnings.report_timing === '盘前' ? '财报当日' : '财报次日') + (moves && moves.reactionDate ? ' · ' + moves.reactionDate.slice(5) : '');
    const subtitle = [earnings.report, [earnings.report_date, earnings.report_timing].filter(Boolean).join(' '), '最近一次已公布的财报'].filter(Boolean).join(' · ');
    const items = earnings.items || [];
    return block('财报拆解', subtitle,
      el('div', { class: 'eyebrow sub-head' }, '实际 vs 预期'),
      (earnings.scorecard || []).length ? renderScorecard(earnings.scorecard) : empty(MISSING),
      el('div', { class: 'eyebrow sub-head' }, '股价反应（按财报日从行情计算）'),
      el('div', { class: 'tiles' },
        moveTile('财报前 1 个月', moves && moves.month1, sectorLabel, sector('month1'), missing),
        moveTile('财报前 3 个月', moves && moves.month3, sectorLabel, sector('month3'), missing),
        moveTile(reactionLabel, moves && moves.reaction, sectorLabel, sector('reaction'), afterNote),
        moveTile('之后至今', moves && moves.since, sectorLabel, sector('since'), afterNote),
        impliedTile(earnings.implied_move, moves && moves.reaction)),
      el('div', { class: 'eyebrow sub-head' }, '逐项判断'),
      items.length ? el('div', { class: 'rows' }, items.map(renderEarningsItem)) : empty(MISSING));
  }

  // ---------- 个股页：新闻与日历 ----------
  function stockNewsRow(item) {
    return newsRow(item, [credibilityPill(item.credibility), pricedTag(item.priced_in)]);
  }
  function renderOvernight(stock) {
    const overnight = stock.overnight || {};
    const items = (overnight.items || []).slice().sort(byNewestFirst).map(stockNewsRow);
    return block('昨晚到今早', null,
      rich(overnight.note) && el('div', { style: 'margin-bottom:10px' }, rich(overnight.note)),
      items.length ? el('div', { class: 'rows' }, items) : empty('没有找到新的消息。'));
  }
  function renderNews(stock) {
    const groups = CATEGORY_ORDER.map((category) => {
      const items = (stock.news || []).filter((item) => item.category === category).sort(byNewestFirst);
      return items.length ? el('div', { class: 'feed-group' }, el('div', { class: 'eyebrow' }, category), el('div', { class: 'rows' }, items.map(stockNewsRow))) : null;
    }).filter(Boolean);
    const searched = stock.news_categories_empty || [];
    return block('公司新闻', '过去 14 天，按类别',
      groups.length ? groups : empty(MISSING),
      searched.length ? el('p', { class: 'empty' }, '已搜索但未找到消息的类别：' + searched.join('、')) : null);
  }
  function renderCalendar(stock) {
    const events = (stock.calendar || []).map((event) => Object.assign({ scope: '公司' }, event))
      .concat((MACRO.calendar || []).map((event) => Object.assign({ scope: '宏观' }, event)))
      .sort(byEventDate).map((event) => eventRow(event, true));
    return block('事件日历', '未来 14 天，含宏观', events.length ? el('div', { class: 'rows' }, events) : empty(MISSING));
  }

  function renderStockPage(stock) {
    const market = SYMBOLS[stock.ticker] || {};
    const sector = stock.sector || {};
    return [
      el('header', { class: 'page-head' }, el('h1', null, stock.ticker, el('span', { class: 'name' }, stock.name || market.name || ''))),
      section('今日分析', null, renderBrief(stock), renderPriceAction(stock), renderTechnical(stock, market)),
      section('多空对照', stock.earnings_mode && '财报时点：' + stock.earnings_mode + (stock.earnings_mode_basis ? '（' + stock.earnings_mode_basis + '）' : ''),
        el('div', { class: 'case-grid' }, renderCase(stock, 'bull'), renderCase(stock, 'bear')),
        renderEarnings(stock, market),
        block('板块与行业', '把公司的问题和环境的问题分开',
          sector.driver && el('div', { class: 'callout' }, el('b', null, '近期走势的主要驱动：'), inline(sector.driver)),
          facts(sector.items) || empty(MISSING))),
      section('新闻与日历', null, renderOvernight(stock), renderNews(stock), renderCalendar(stock)),
    ];
  }

  // ---------- 路由 ----------
  const stockByTicker = Object.fromEntries(STOCKS.map((stock) => [stock.ticker, stock]));
  const app = document.getElementById('app');
  const main = el('main');

  function currentRoute() {
    let route = '';
    try { route = decodeURIComponent(location.hash.slice(1)); } catch (error) { route = ''; }
    return stockByTicker[route] ? route : MACRO_ROUTE;
  }
  function render(keepScroll) {
    const scrollY = window.scrollY;
    const route = currentRoute();
    for (const chart of charts) chart.dispose();
    charts = [];
    pendingCharts = [];
    app.replaceChildren(renderSidebar(), main);
    for (const item of app.querySelectorAll('.nav-item')) item.classList.toggle('active', item.getAttribute('data-route') === route);
    main.replaceChildren(...[].concat(route === MACRO_ROUTE ? renderMacroPage() : renderStockPage(stockByTicker[route])).filter(Boolean));
    document.title = (route === MACRO_ROUTE ? '宏观' : route) + ' · 盘前简报 ' + (REPORT.date || '');
    for (const draw of pendingCharts) draw();
    window.scrollTo(0, keepScroll ? scrollY : 0);
  }

  applyScheme(loadScheme());
  window.addEventListener('hashchange', () => render(false));
  window.addEventListener('resize', () => { for (const chart of charts) chart.resize(); });
  render(false);
})();
</script>
</body>
</html>
